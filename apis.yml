aid: eclypsium
name: Eclypsium
description: >-
  Eclypsium is a supply-chain and infrastructure security company that delivers
  firmware, hardware, and low-level software assurance for enterprise and national
  infrastructure. Its cloud-based platform continuously scans laptops, servers,
  network gear, and other devices for firmware implants, rootkits, backdoors,
  vulnerable components, and integrity drift below the operating system, giving
  security teams device-level visibility, threat detection, and supply-chain risk
  management across the hardware and firmware lifecycle. Eclypsium integrates with
  SIEM, SOAR, and IT workflows and is used to defend against firmware-level attacks,
  enforce device integrity, and meet supply-chain security and compliance
  requirements. The company was surfaced as an a16z portfolio company and is
  profiled here in the API Evangelist network. No public self-service developer
  API is currently published; enrichment captured the company's security, trust,
  and disclosure posture.
